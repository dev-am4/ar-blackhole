<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Black Hole AR · Diagnostics</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#02040a;color:#f4f6fb;font-family:Tahoma,system-ui,sans-serif;padding:22px}.wrap{max-width:680px;margin:auto}h1{font-size:30px;margin:8px 0}.sub{color:#9eabc7;line-height:1.6}.grid{display:grid;gap:9px;margin:20px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid rgba(150,185,255,.2);border-radius:14px;background:rgba(10,15,31,.8)}.row b{font-size:13px}.state{font:700 11px ui-monospace,monospace;color:#ffd28f}.ok{color:#91f1bd}.bad{color:#ff8d96}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:999px;border:1px solid rgba(150,185,255,.25);background:#111a31;color:white;text-decoration:none;font:700 14px inherit}button{width:100%;cursor:pointer;background:linear-gradient(135deg,#ffe5b5,#ff9e50);color:#130b07;border:0}pre{white-space:pre-wrap;word-break:break-word;padding:14px;border-radius:14px;background:#000;border:1px solid rgba(150,185,255,.16);color:#9ce9bd;font:11px/1.5 ui-monospace,monospace}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body><main class="wrap">
<div style="font:700 10px ui-monospace,monospace;color:#8ddcff;letter-spacing:.14em">BLACK HOLE AR · DIAGNOSTICS</div>
<h1>ตรวจความพร้อมเครื่อง</h1>
<p class="sub">หน้านี้ไม่เปิด AR เต็มรูปแบบ แต่ตรวจเงื่อนไขหลักก่อนใช้งานจริงบนมือถือ</p>
<div class="grid">
  <div class="row"><b>HTTPS / Secure Context</b><span id="secure" class="state">…</span></div>
  <div class="row"><b>Camera API</b><span id="cameraApi" class="state">…</span></div>
  <div class="row"><b>WebXR API</b><span id="xrApi" class="state">…</span></div>
  <div class="row"><b>Immersive AR</b><span id="immersive" class="state">…</span></div>
  <div class="row"><b>Motion Sensor API</b><span id="motion" class="state">…</span></div>
  <div class="row"><b>Three.js CDN</b><span id="cdn" class="state">…</span></div>
</div>
<button id="run">ขอสิทธิ์กล้อง + Motion แล้วทดสอบ</button>
<pre id="log">พร้อมตรวจ…</pre>
<div class="links"><a href="/">← กลับ Black Hole AR</a><a href="/?debug=1">เปิด AR + Debug HUD</a></div>
</main>
<script>
const $=s=>document.querySelector(s), log=$('#log');
const set=(id,text,ok)=>{const e=$(id);e.textContent=text;e.className='state '+(ok===true?'ok':ok===false?'bad':'')};
set('#secure',isSecureContext?'PASS':'FAIL',isSecureContext);
set('#cameraApi',navigator.mediaDevices?.getUserMedia?'PASS':'FAIL',!!navigator.mediaDevices?.getUserMedia);
set('#xrApi',navigator.xr?'AVAILABLE':'NOT FOUND',!!navigator.xr);
set('#motion',typeof DeviceOrientationEvent!=='undefined'?'AVAILABLE':'NOT FOUND',typeof DeviceOrientationEvent!=='undefined');
(async()=>{
  try{const ok=navigator.xr?await navigator.xr.isSessionSupported('immersive-ar'):false;set('#immersive',ok?'SUPPORTED':'FALLBACK',ok?true:null)}catch{set('#immersive','FALLBACK',null)}
  try{const r=await fetch('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',{method:'HEAD',mode:'cors'});set('#cdn',r.ok?'PASS':'FAIL',r.ok)}catch{set('#cdn','FAIL',false)}
})();
$('#run').addEventListener('click',async()=>{
  const lines=[];
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      const p=await DeviceOrientationEvent.requestPermission();lines.push('Motion permission: '+p);
    }else lines.push('Motion permission: not required / unavailable');
  }catch(e){lines.push('Motion permission error: '+e.name+' '+e.message)}
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const track=stream.getVideoTracks()[0];lines.push('Camera: PASS');lines.push('Camera label: '+(track.label||'(hidden)'));lines.push('Camera settings: '+JSON.stringify(track.getSettings?.()||{}));
  }catch(e){lines.push('Camera: FAIL '+e.name+' '+e.message)}finally{stream?.getTracks().forEach(t=>t.stop())}
  lines.push('User agent: '+navigator.userAgent);
  log.textContent=lines.join('\n');
});
</script>
</body></html>
