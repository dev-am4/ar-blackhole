<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101C16">
<title>ป่าดงพงไพร · AR</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
<style>
:root{--ink:#0b1611;--paper:#f3ecdd;--gold:#d8b86a;--ready:#bfff62;--ready-dark:#16351f;--bloom:#e76786;--edge:rgba(216,184,106,.3)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Tahoma,system-ui,sans-serif}
button{font:inherit;touch-action:manipulation}
#feed,canvas.gl{position:fixed;inset:0;width:100%;height:100%}
#feed{display:none;object-fit:cover;background:#000}
canvas.gl{display:block}
#stage{position:fixed;width:2px;height:2px;opacity:.01;overflow:hidden;pointer-events:none}
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 20px);overflow:auto;background:radial-gradient(circle at 80% 10%,rgba(80,125,88,.45),transparent 35%),linear-gradient(150deg,#1b3526,#09120e)}
.brand{font-size:11px;line-height:1.45;color:#b9ccae}.eyebrow{margin-top:18px;color:var(--gold);font:10px ui-monospace,monospace;letter-spacing:.18em}.title{font-size:clamp(34px,10vw,52px);line-height:1.12;margin-top:7px}.subtitle{color:#cdd8c8;font-size:14px;line-height:1.65;margin-top:8px}
#cards{display:grid;gap:10px;margin-top:auto;padding-top:20px}.card{position:relative;width:100%;min-height:108px;display:grid;grid-template-columns:92px 1fr;align-items:center;gap:15px;padding:12px;border:1px solid var(--edge);border-radius:20px;background:rgba(32,57,41,.82);color:var(--paper);text-align:left}.card img{width:92px;height:84px;object-fit:contain}.card strong{display:block;font-size:21px}.card em{display:block;margin-top:3px;color:#b9ccae;font-size:12px}.card::after{content:'แตะเพื่อเริ่ม AR';display:block;margin-top:12px;color:#132018;background:var(--gold);padding:10px 15px;border-radius:999px;text-align:center;font-weight:700}.direct .title{font-size:clamp(32px,9vw,48px)}.direct .subtitle{display:none}.direct #cards{flex:1;display:flex;min-height:0}.direct .card{display:flex;flex:1;flex-direction:column;justify-content:center;text-align:center;border-width:2px;border-radius:28px}.direct .card img{width:min(72vw,340px);height:min(48vh,400px)}
#ar{position:fixed;inset:0;z-index:30;display:none;pointer-events:none;transition:box-shadow .25s}#ar.on{display:block}#ar.ready-to-place{box-shadow:inset 0 0 0 5px rgba(191,255,98,.9),inset 0 0 90px rgba(79,255,118,.24)}#ar.ready-to-place::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 62%,rgba(191,255,98,.23),transparent 34%);animation:readyGlow 1.25s ease-in-out infinite}
.top{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;gap:9px;padding:calc(env(safe-area-inset-top) + 12px) 14px 24px;background:linear-gradient(rgba(7,17,11,.78),transparent);pointer-events:auto}.dot{width:9px;height:9px;border-radius:50%;background:var(--bloom)}.dot.ready{background:var(--ready);box-shadow:0 0 0 7px rgba(191,255,98,.18),0 0 22px rgba(191,255,98,.85);animation:dotPulse 1s ease-in-out infinite}.name{font-size:12px}.exit{margin-left:auto;border:1px solid var(--edge);border-radius:999px;padding:10px 15px;background:rgba(18,34,25,.8);color:var(--paper)}
.hint{position:absolute;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom) + 116px);max-width:92vw;transform:translateX(-50%);padding:11px 18px;border:1px solid var(--edge);border-radius:999px;background:rgba(18,34,25,.86);font-size:13px;text-align:center;white-space:nowrap;transition:background .2s,color .2s,transform .2s,box-shadow .2s}.hint.ready{background:var(--ready);color:var(--ready-dark);font-size:15px;font-weight:800;border-color:#efffcf;box-shadow:0 0 0 4px rgba(191,255,98,.22),0 12px 36px rgba(0,0,0,.38);transform:translateX(-50%) scale(1.04)}
.ready-banner{position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 76px);left:50%;width:min(88vw,390px);transform:translateX(-50%) translateY(-8px);padding:13px 18px;border:2px solid rgba(241,255,211,.95);border-radius:20px;background:linear-gradient(135deg,rgba(191,255,98,.97),rgba(91,238,119,.96));color:#102d18;text-align:center;box-shadow:0 14px 45px rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .22s,transform .22s}.ready-banner.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);animation:bannerBreathe 1.2s ease-in-out infinite}.ready-banner strong{display:block;font-size:22px;line-height:1.2}.ready-banner span{display:block;margin-top:3px;font-size:13px;font-weight:700}.ready-banner span::after{content:'  ↓';font-size:20px}
.dock{position:absolute;z-index:4;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:16px 12px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(transparent,rgba(7,17,11,.88));pointer-events:auto}.btn{min-height:48px;padding:11px 18px;border:1px solid var(--edge);border-radius:999px;background:rgba(18,34,25,.84);color:var(--paper)}.btn.hero{background:var(--gold);color:#132018;font-weight:700}.btn:disabled{opacity:.42}.btn.hero.ready{min-width:min(86vw,360px);min-height:64px;background:var(--ready);border:3px solid #f1ffd8;color:#102d18;font-size:20px;font-weight:900;box-shadow:0 0 0 6px rgba(191,255,98,.2),0 14px 38px rgba(0,0,0,.42);animation:placePulse .9s ease-in-out infinite}
#msg{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:28px;background:rgba(8,18,12,.97);text-align:center}#msg.on{display:grid}#msg h2{margin-bottom:10px}#msg p{color:#cdd8c8;line-height:1.65;margin-bottom:18px}
@keyframes placePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
@keyframes readyGlow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes dotPulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.25)}}
@keyframes bannerBreathe{0%,100%{box-shadow:0 14px 45px rgba(0,0,0,.42)}50%{box-shadow:0 14px 55px rgba(191,255,98,.44)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<video id="feed" playsinline muted autoplay></video>
<div id="stage"></div>
<section id="intro">
  <div class="brand">พิพิธภัณฑ์การเกษตรเฉลิมพระเกียรติฯ · ปทุมธานี</div>
  <div class="eyebrow">AR NATURE EXPERIENCE</div>
  <h1 class="title">ป่าดงพงไพร</h1>
  <p class="subtitle">เลือกสิ่งมีชีวิต แล้วเปิดกล้องเพื่อวางลงบนพื้นตรงหน้า</p>
  <div id="cards"></div>
</section>
<div id="ar">
  <div class="top"><span id="dot" class="dot"></span><span id="name" class="name">กำลังเตรียม</span><button id="exit" class="exit">ออก</button></div>
  <div id="readyBanner" class="ready-banner" role="status" aria-live="assertive"><strong>พร้อมวางแล้ว!</strong><span>แตะปุ่มด้านล่างตอนนี้</span></div>
  <div id="hint" class="hint" aria-live="polite">กำลังเปิดกล้อง…</div>
  <div class="dock"><button id="place" class="btn hero" disabled>รอจับพื้น…</button><button id="replay" class="btn" hidden>เล่นอีกครั้ง</button><button id="move" class="btn" hidden>ย้ายที่</button></div>
</div>
<div id="msg"><div><h2 id="msgTitle"></h2><p id="msgText"></p><button class="btn hero" onclick="location.reload()">ลองใหม่</button></div></div>
<script type="module">
const THREE_URL='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const threePromise=import(THREE_URL).then(mod=>{mod.ColorManagement.enabled=false;return mod});
const SPECIMENS=[
 {id:'tulip',th:'ดอกกระเจียวแดง',sci:'Curcuma alismatifolia',file:'tulip.mp4',width:1.50,baseY:.45},
 {id:'butterfly',th:'ผีเสื้อ',sci:'Lepidoptera',file:'butterfly.mp4',width:2.40,baseY:1.30},
 {id:'mushroom',th:'เห็ดป่าเต็งรัง',sci:'Fungi spp.',file:'mushroom.mp4',width:1.15,baseY:.32}
];
const THUMBS={tulip:'/thumbs/tulip.webp',butterfly:'/thumbs/butterfly.webp',mushroom:'/thumbs/mushroom.webp'};
const POINTS={'1':'tulip','2':'butterfly','3':'mushroom'};
const pathPoint=location.pathname.match(/^\/p([123])\/?$/)?.[1];
const qp=new URLSearchParams(location.search);
const directId=POINTS[pathPoint||qp.get('p')]||qp.get('s');
const DIRECT=SPECIMENS.find(x=>x.id===directId)||null;
const $=s=>document.querySelector(s);
const intro=$('#intro'),ar=$('#ar'),feed=$('#feed'),hint=$('#hint'),dot=$('#dot'),place=$('#place'),replay=$('#replay'),move=$('#move'),readyBanner=$('#readyBanner');
if(DIRECT)intro.classList.add('direct');
$('#cards').innerHTML=(DIRECT?[DIRECT]:SPECIMENS).map(s=>`<button class="card" data-id="${s.id}"><img src="${THUMBS[s.id]}" alt="${s.th}" width="340" height="400" decoding="async" ${DIRECT?'fetchpriority="high"':'loading="lazy"'}><span><strong>${s.th}</strong><em>${s.sci}</em></span></button>`).join('');
let THREE,renderer,scene,cam,reticle,group,video,texture,plane,xrSession,xrHitSource,stream;
let launching=false,moving=true,placed=false,assetReady=false,trackingReady=false,fullyReady=false,mode='boot',scale=1,pinch0=0,scale0=1;
let readyLostTimer=null,lastReadySignalAt=0;
let q={alpha:0,beta:0,gamma:0,orient:0,live:false};
let zee,euler,q0,q1,ray,ground,hit;
const VERT=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const FRAG=`varying vec2 vUv;uniform sampler2D map;void main(){vec3 c=texture2D(map,vec2(vUv.x,vUv.y*.5+.5)).rgb;float a=texture2D(map,vec2(vUv.x,vUv.y*.5)).r;if(a<.012)discard;gl_FragColor=vec4(c,a);}`;
function fail(t,p){$('#msgTitle').textContent=t;$('#msgText').textContent=p;$('#msg').classList.add('on')}
function requestOrientation(){return(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)?DeviceOrientationEvent.requestPermission().catch(()=>'denied'):Promise.resolve('granted')}
function requestFallbackCamera(){return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(async s=>{stream=s;feed.srcObject=s;feed.style.display='block';await feed.play().catch(()=>{});hint.textContent='กล้องพร้อมแล้ว · เล็งลงที่พื้น';return s})}
function requestXR(){if(!navigator.xr)return Promise.resolve(null);try{return navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:ar}}).catch(()=>null)}catch{return Promise.resolve(null)}}
function makeVideo(spec){const v=document.createElement('video');v.src='/'+spec.file;v.loop=true;v.muted=true;v.playsInline=true;v.preload='auto';v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');$('#stage').appendChild(v);return v}
function videoReady(v,ms=9000){return new Promise(resolve=>{if(v.readyState>=2&&v.videoWidth)return resolve(true);const t=setTimeout(()=>resolve(false),ms);const ok=()=>{clearTimeout(t);resolve(true)};v.addEventListener('loadeddata',ok,{once:true});v.addEventListener('error',()=>{clearTimeout(t);resolve(false)},{once:true})})}
function buildScene(spec){
 scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.01,100);cam.position.set(0,1.45,0);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.outputColorSpace=THREE.LinearSRGBColorSpace;renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.domElement.className='gl';document.body.appendChild(renderer.domElement);
 reticle=new THREE.Mesh(new THREE.RingGeometry(.08,.112,40),new THREE.MeshBasicMaterial({color:0xd8b86a,transparent:true,opacity:.96,side:THREE.DoubleSide}));reticle.rotation.x=-Math.PI/2;reticle.visible=false;scene.add(reticle);
 group=new THREE.Group();group.visible=false;scene.add(group);
 texture=new THREE.VideoTexture(video);texture.colorSpace=THREE.NoColorSpace;texture.minFilter=THREE.LinearFilter;texture.magFilter=THREE.LinearFilter;
 plane=new THREE.Mesh(new THREE.PlaneGeometry(spec.width,spec.width*9/16),new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:FRAG,uniforms:{map:{value:texture}},transparent:true,premultipliedAlpha:true,depthWrite:false,side:THREE.DoubleSide}));plane.position.y=spec.baseY;group.add(plane);
 zee=new THREE.Vector3(0,0,1);euler=new THREE.Euler();q0=new THREE.Quaternion();q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2);ray=new THREE.Raycaster();ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);hit=new THREE.Vector3();
 addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
}
async function startXR(session){mode='xr';xrSession=session;renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local');await renderer.xr.setSession(session);const viewer=await session.requestReferenceSpace('viewer');xrHitSource=await session.requestHitTestSource({space:viewer});session.addEventListener('end',()=>location.reload());renderer.setAnimationLoop(renderXR);hint.textContent='ขยับกล้องช้า ๆ แล้วเล็งลงที่พื้น'}
async function startFallback(orientationPromise,cameraPromise){mode='fallback';await(cameraPromise||requestFallbackCamera());q.live=(await orientationPromise)==='granted';if(q.live)addEventListener('deviceorientation',e=>{if(e.alpha==null)return;q.alpha=THREE.MathUtils.degToRad(e.alpha);q.beta=THREE.MathUtils.degToRad(e.beta);q.gamma=THREE.MathUtils.degToRad(e.gamma);q.orient=THREE.MathUtils.degToRad(screen.orientation?.angle||window.orientation||0)},true);else cam.rotation.set(-.42,0,0);renderer.setAnimationLoop(renderFallback);hint.textContent=q.live?'เล็งกล้องลงที่พื้น':'เปิดกล้องแล้ว · เล็งลงที่พื้นเพื่อวาง'}
function orientCamera(){if(!q.live)return;euler.set(q.beta,q.alpha,-q.gamma,'YXZ');cam.quaternion.setFromEuler(euler).multiply(q1).multiply(q0.setFromAxisAngle(zee,-q.orient))}
function billboard(activeCam){if(!group.visible)return;const p=new THREE.Vector3();activeCam.getWorldPosition(p);group.rotation.y=Math.atan2(p.x-group.position.x,p.z-group.position.z)}
function setReadyVisual(ready){
 const becameReady=ready&&!fullyReady;
 fullyReady=ready;
 ar.classList.toggle('ready-to-place',ready);dot.classList.toggle('ready',ready);hint.classList.toggle('ready',ready);place.classList.toggle('ready',ready);readyBanner.classList.toggle('show',ready);
 place.disabled=!ready;place.textContent=ready?'แตะเพื่อวางตรงนี้!':(trackingReady?'กำลังเตรียมวิดีโอ…':'รอจับพื้น…');
 if(reticle){reticle.material.color.setHex(ready?0xbfff62:0xd8b86a);reticle.material.opacity=ready?1:.88}
 if(ready){hint.textContent='พร้อมแล้ว! แตะปุ่มด้านล่างเพื่อวาง';const now=Date.now();if(becameReady&&now-lastReadySignalAt>2500&&navigator.vibrate){lastReadySignalAt=now;navigator.vibrate([80,40,80])}}
}
function refreshReadyState(){const ready=trackingReady&&assetReady;setReadyVisual(ready);if(ready)return;if(trackingReady&&!assetReady)hint.textContent='พบพื้นแล้ว · กำลังเตรียมวิดีโอ';else if(assetReady&&!trackingReady)hint.textContent='วิดีโอพร้อมแล้ว · เล็งกล้องลงที่พื้น';else hint.textContent='ขยับกล้องช้า ๆ แล้วเล็งลงที่พื้น'}
function updateReady(v){clearTimeout(readyLostTimer);if(v){trackingReady=true;refreshReadyState();return}readyLostTimer=setTimeout(()=>{trackingReady=false;refreshReadyState()},320)}
function animateReticle(){if(!reticle||!reticle.visible)return;const pulse=fullyReady?1.18+Math.sin(performance.now()*.009)*.14:1;reticle.scale.setScalar(pulse)}
function renderXR(_,frame){if(frame&&moving&&xrHitSource){const ref=renderer.xr.getReferenceSpace();if(ref){const hits=frame.getHitTestResults(xrHitSource);if(hits.length){const pose=hits[0].getPose(ref);reticle.visible=true;reticle.position.setFromMatrixPosition(new THREE.Matrix4().fromArray(pose.transform.matrix));updateReady(true)}else{reticle.visible=false;updateReady(false)}}}animateReticle();billboard(renderer.xr.getCamera());renderer.render(scene,cam)}
function renderFallback(){orientCamera();cam.updateMatrixWorld(true);if(moving){ray.setFromCamera(new THREE.Vector2(0,0),cam);const ok=ray.ray.intersectPlane(ground,hit)&&hit.distanceTo(cam.position)<8;reticle.visible=!!ok;if(ok)reticle.position.copy(hit);updateReady(!!ok)}animateReticle();billboard(cam);renderer.render(scene,cam)}
function launch(spec){if(launching)return;launching=true;$('#name').textContent=spec.th;intro.style.display='none';ar.classList.add('on');hint.textContent='กำลังเปิดกล้อง…';const orientationPromise=requestOrientation();const sessionPromise=requestXR();const cameraPromise=navigator.xr?null:requestFallbackCamera();video=makeVideo(spec);const playPromise=video.play().catch(()=>null);boot(spec,orientationPromise,sessionPromise,cameraPromise,playPromise)}
async function boot(spec,orientationPromise,sessionPromise,cameraPromise,playPromise){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('เบราว์เซอร์นี้ไม่รองรับกล้อง');THREE=await threePromise;buildScene(spec);const session=await sessionPromise;if(session)await startXR(session);else await startFallback(orientationPromise,cameraPromise);Promise.all([playPromise,videoReady(video)]).then(([,ok])=>{if(!ok)return fail('โหลดวิดีโอไม่สำเร็จ','กรุณารีเฟรชแล้วลองใหม่');assetReady=true;refreshReadyState()}).catch(()=>fail('เล่นวิดีโอไม่ได้','กรุณาปิดโหมดประหยัดพลังงานแล้วลองใหม่'))}catch(e){console.error(e);fail('เปิด AR ไม่ได้',e.message||'กรุณาตรวจสอบสิทธิ์กล้องและอินเทอร์เน็ต')}}
place.addEventListener('click',()=>{if(!reticle.visible||!assetReady||!fullyReady)return;group.position.copy(reticle.position);group.visible=true;reticle.visible=false;moving=false;placed=true;group.scale.setScalar(scale);video.currentTime=0;video.play().catch(()=>{});setReadyVisual(false);place.hidden=true;replay.hidden=false;move.hidden=false;hint.textContent='วางสำเร็จแล้ว · เดินรอบดูได้';hint.classList.remove('ready')});
replay.addEventListener('click',()=>{video.currentTime=0;video.play().catch(()=>{});});
move.addEventListener('click',()=>{moving=true;placed=false;group.visible=false;place.hidden=false;place.disabled=true;replay.hidden=true;move.hidden=true;clearTimeout(readyLostTimer);trackingReady=false;setReadyVisual(false);refreshReadyState()});
$('#exit').addEventListener('click',()=>location.reload());
addEventListener('touchstart',e=>{if(e.touches.length===2&&placed){pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale0=scale}},{passive:true});
addEventListener('touchmove',e=>{if(e.touches.length===2&&placed&&pinch0){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=THREE.MathUtils.clamp(scale0*d/pinch0,.35,3.5);group.scale.setScalar(scale)}},{passive:true});
addEventListener('touchend',()=>{pinch0=0},{passive:true});
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>launch(SPECIMENS.find(s=>s.id===c.dataset.id))));
</script>
</body>
</html>
